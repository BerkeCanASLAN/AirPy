name: Release

on:
  push:
    tags: ["v*"]

permissions: {}

jobs:
  release:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v7
      - name: Build archives
        run: |
          tag="${GITHUB_REF_NAME}"
          git archive --format=zip --prefix="AirPy-${tag}/" -o "AirPy-${tag}.zip" HEAD
          (cd extension && zip -r -q "../AirPy-Extension-${tag}.zip" .)
      - name: Publish release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "$GITHUB_REF_NAME" AirPy-*.zip \
            --title "AirPy $GITHUB_REF_NAME" --generate-notes
