name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    runs-on: windows-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.12", "3.14"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v7
        with:
          python-version: ${{ matrix.python-version }}
      - name: Install test dependencies
        # GUI/audio packages (PySide6, PyAudioWPatch, ...) are not needed by the tests
        run: python -m pip install "pyatv>=0.18,<0.19" "srptools<2" numpy aiohttp pytest ruff
      - run: ruff check .
      - run: pytest

  requirements:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v7
        with:
          python-version: "3.14"
      - name: requirements.txt must resolve
        run: python -m pip install --dry-run -r requirements.txt

  extension:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Syntax check
        run: |
          for f in extension/*.js; do node --check "$f"; done
          node -e "JSON.parse(require('fs').readFileSync('extension/manifest.json','utf8'))"
